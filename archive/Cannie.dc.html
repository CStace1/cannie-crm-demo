<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="../_ds/cannie-design-system-274f8e6c-a122-4036-a007-5de642372887/tokens/fonts.css">
<link rel="stylesheet" href="../_ds/cannie-design-system-274f8e6c-a122-4036-a007-5de642372887/styles.css">
<script src="../_ds/cannie-design-system-274f8e6c-a122-4036-a007-5de642372887/_ds_bundle.js"></script>
<style>
body{margin:0;background:#F3EEE6}
a{color:#9E2D53}
a:hover{color:#7D2342}
</style>
</helmet>
<div style="min-height:100vh;background:#F3EEE6">
<sc-if value="{{ isOverview }}" hint-placeholder-val="{{ true }}">
<dc-import name="App Overview" hint-size="100%,100vh"></dc-import>
</sc-if>
<sc-if value="{{ isStandards }}" hint-placeholder-val="{{ false }}">
<dc-import name="Standards" hint-size="100%,100vh"></dc-import>
</sc-if>
<sc-if value="{{ isIndex }}" hint-placeholder-val="{{ false }}">
<dc-import name="Index" hint-size="100%,100vh"></dc-import>
</sc-if>
<sc-if value="{{ isClients }}" hint-placeholder-val="{{ false }}">
<dc-import name="App Clients" hint-size="100%,100vh"></dc-import>
</sc-if>
<sc-if value="{{ isClient }}" hint-placeholder-val="{{ false }}">
<dc-import name="App Client" hint-size="100%,100vh"></dc-import>
</sc-if>
<sc-if value="{{ isJob }}" hint-placeholder-val="{{ false }}">
<dc-import name="App Job" hint-size="100%,100vh"></dc-import>
</sc-if>
<sc-if value="{{ isCandidate }}" hint-placeholder-val="{{ false }}">
<dc-import name="App Candidate" hint-size="100%,100vh"></dc-import>
</sc-if>
<sc-if value="{{ isBoard }}" hint-placeholder-val="{{ false }}">
<dc-import name="App Job Board" hint-size="100%,100vh"></dc-import>
</sc-if>
<sc-if value="{{ isCandidates }}" hint-placeholder-val="{{ false }}">
<dc-import name="App Candidates" hint-size="100%,100vh"></dc-import>
</sc-if>
<sc-if value="{{ isContact }}" hint-placeholder-val="{{ false }}">
<dc-import name="App Contact" hint-size="100%,100vh"></dc-import>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const p = new URLSearchParams(window.location.search).get('page') || 'overview';
    return {isOverview: p === 'overview', isClients: p === 'clients', isClient: p === 'client', isJob: p === 'job', isCandidate: p === 'candidate', isStandards: p === 'standards', isIndex: p === 'index', isContact: p === 'contact', isBoard: p === 'board', isCandidates: p === 'candidates'};
  }
}
</script>
</body>
</html>
