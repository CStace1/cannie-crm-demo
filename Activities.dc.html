<script type="text/x-dc" data-dc-script>
const INK = '#2B211B', BERRY = '#9E2D53', MID = 'rgba(43,33,27,.70)', TAUPE = '#D9CFC0';
const ACT = [
  {date: '2026-09-22', when: 'Today, 10:31', kind: 'Call', what: 'Called Dan Okafor on the shortlist', who: 'Priya Shah', about: 'Dan Okafor', href: 'Contact Record.dc.html'},
  {date: '2026-09-22', when: 'Today, 09:12', kind: 'Stage', what: 'Amara Osei moved to Interview', who: 'Priya Shah', about: 'Amara Osei', href: 'Candidate Record.dc.html'},
  {date: '2026-09-22', when: 'Today, 08:50', kind: 'Email', what: '3 emails attached to Brightwell Payments', who: 'System', about: 'Brightwell Payments', href: 'Client Record.dc.html'},
  {date: '2026-09-21', when: 'Yesterday', kind: 'Milestone', what: 'Milestone 3 sent to Dan for approval', who: 'Priya Shah', about: 'Payments migration, phase 2', href: 'Job Record.dc.html?type=SOW'},
  {date: '2026-09-21', when: 'Yesterday', kind: 'Note', what: 'Rosa Alvarez offer awaiting Dan\'s sign off', who: 'Priya Shah', about: 'Rosa Alvarez', href: 'Candidate Record.dc.html'},
  {date: '2026-09-20', when: '2 days ago', kind: 'Call', what: 'Claire Dunn confirmed rate card review, 30 Sep', who: 'Priya Shah', about: 'Claire Dunn', href: 'Contact Record.dc.html'},
  {date: '2026-09-20', when: '2 days ago', kind: 'Stage', what: 'Femi Adebayo right to work checked, expires in 9 days', who: 'Priya Shah', about: 'Femi Adebayo', href: 'Candidate Record.dc.html'},
  {date: '2026-09-19', when: '3 days ago', kind: 'Meeting', what: 'Rate card call with Ruth Vance', who: 'Nadia Croft', about: 'Ruth Vance', href: 'Contact Record.dc.html'},
  {date: '2026-09-18', when: '4 days ago', kind: 'Email', what: 'Sent terms of business to Marcus Lyle', who: 'Sam Iyer', about: 'Marcus Lyle', href: 'Contact Record.dc.html'},
  {date: '2026-09-17', when: '5 days ago', kind: 'Note', what: 'Tom Whitfield rebate window ends 3 Oct', who: 'Priya Shah', about: 'Tom Whitfield', href: 'Candidate Record.dc.html'},
];
class Component extends DCLogic {
  state = {q: '', personSearch: '', personFilter: '', personListOpen: false, kind: 'All', dateFrom: '', dateTo: ''};
  renderVals() {
    const s = this.state;
    const people = Array.from(new Set(ACT.map(a => a.about))).sort();
    const term = s.personSearch.trim().toLowerCase();
    const q = s.q.trim().toLowerCase();
    let rows = ACT;
    if (q) rows = rows.filter(a => (a.what + ' ' + a.who + ' ' + a.about + ' ' + a.kind).toLowerCase().includes(q));
    if (s.personFilter) rows = rows.filter(a => a.about === s.personFilter);
    if (s.kind !== 'All') rows = rows.filter(a => a.kind === s.kind);
    if (s.dateFrom) rows = rows.filter(a => a.date >= s.dateFrom);
    if (s.dateTo) rows = rows.filter(a => a.date <= s.dateTo);
    const kinds = ['All', ...Array.from(new Set(ACT.map(a => a.kind)))];
    return {
      q: s.q, setQ: e => this.setState({q: e.target.value}),
      personSearch: s.personSearch, setPersonSearch: e => this.setState({personSearch: e.target.value, personListOpen: true}),
      openPersonList: () => this.setState({personListOpen: true}), personListOpen: s.personListOpen,
      personMatches: people.filter(p => !term || p.toLowerCase().includes(term)).slice(0, 8).map(p => ({name: p, count: String(ACT.filter(a => a.about === p).length), pick: () => this.setState({personFilter: p, personSearch: p, personListOpen: false})})),
      hasPersonFilter: !!s.personFilter, clearPerson: () => this.setState({personFilter: '', personSearch: '', personListOpen: false}),
      kindFilters: kinds.map(k => ({label: k, go: () => this.setState({kind: k}), border: s.kind === k ? '1px solid ' + INK : '1px solid ' + TAUPE, ink: s.kind === k ? INK : MID, weight: s.kind === k ? '600' : '400'})),
      dateFrom: s.dateFrom, setDateFrom: e => this.setState({dateFrom: e.target.value}),
      dateTo: s.dateTo, setDateTo: e => this.setState({dateTo: e.target.value}),
      hasDateFilter: !!(s.dateFrom || s.dateTo), clearDates: () => this.setState({dateFrom: '', dateTo: ''}),
      resultLine: rows.length + ' of ' + ACT.length + ' logged' + (s.personFilter ? ', about ' + s.personFilter : '') + (s.kind !== 'All' ? ', ' + s.kind.toLowerCase() : '') + '.',
      rows: rows.map(a => ({...a, byLine: a.who + ', about ' + a.about})), empty: rows.length === 0,
    };
  }
}

</script>
