<script type="text/x-dc" data-dc-script>
const MAP = {overview: 'Overview.dc.html', board: 'Job Board.dc.html', job: 'Job Record.dc.html', clients: 'Clients.dc.html', client: 'Client Record.dc.html', candidates: 'Candidates.dc.html', candidate: 'Candidate Record.dc.html', contact: 'Contact Record.dc.html', contacts: 'Contacts.dc.html', standards: 'Standards.dc.html', pipeline: 'Pipeline.dc.html'};
class Component extends DCLogic {
  componentDidMount() { const u = new URLSearchParams(window.location.search); const p = u.get('page') || 'overview'; u.delete('page'); const rest = u.toString(); window.location.replace((MAP[p] || 'Overview.dc.html') + (rest ? '?' + rest : '')); }
  renderVals() { return {}; }
}

</script>
