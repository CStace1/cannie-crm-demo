<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/cannie-design-system-274f8e6c-a122-4036-a007-5de642372887/tokens/fonts.css">
<link rel="stylesheet" href="_ds/cannie-design-system-274f8e6c-a122-4036-a007-5de642372887/styles.css">
<script src="_ds/cannie-design-system-274f8e6c-a122-4036-a007-5de642372887/_ds_bundle.js"></script>
<style>body{margin:0;background:#F3EEE6}a{color:#9E2D53}a:hover{color:#7D2342}</style>
</helmet>
<div style="max-width:820px;margin:0 auto;padding:40px 32px 80px;font-family:'Poppins',sans-serif;color:#2B211B;display:flex;flex-direction:column;gap:20px">
<a href="Overview.dc.html" style="font-size:13px;color:#9E2D53;text-decoration:none">← Back to Overview</a>
<div style="display:flex;flex-direction:column;gap:10px">
<span style="font-size:10px;font-weight:700;letter-spacing:0.364em;text-transform:uppercase;color:rgba(43,33,27,.70)">Search</span>
<input type="text" value="{{ q }}" onChange="{{ setQ }}" placeholder="A name, a client, a skill, a job" style="height:44px;padding:0 16px;border:1px solid rgba(43,33,27,.85);border-radius:10px;background:#F3EEE6;font-family:inherit;font-size:16px;color:#2B211B;box-sizing:border-box">
<p style="margin:0;font-size:13px;color:rgba(43,33,27,.55)">{{ resultLine }}</p>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
<sc-for list="{{ typeFilters }}" as="tf" hint-placeholder-count="6">
<button onClick="{{ tf.go }}" style="height:32px;padding:0 13px;border-radius:999px;font-family:inherit;font-size:13px;cursor:pointer;background:transparent;border:{{ tf.border }};color:{{ tf.ink }};font-weight:{{ tf.weight }}">{{ tf.label }}</button>
</sc-for>
<span style="flex:1"></span>
<span style="font-size:13px;color:rgba(43,33,27,.55)">Sort</span>
<sc-for list="{{ sorts }}" as="so" hint-placeholder-count="2">
<button onClick="{{ so.go }}" style="background:transparent;border:none;padding:0;font-family:inherit;font-size:13px;cursor:pointer;color:{{ so.ink }};font-weight:{{ so.weight }};text-decoration:{{ so.deco }}">{{ so.label }}</button>
</sc-for>
</div>
<sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
<div style="display:flex;flex-direction:column;gap:2px">
<span style="font-size:10px;font-weight:700;letter-spacing:0.364em;text-transform:uppercase;color:rgba(43,33,27,.70);padding:8px 4px 4px">{{ g.label }}</span>
<sc-for list="{{ g.hits }}" as="h" hint-placeholder-count="3">
<a href="{{ h.href }}" style="display:flex;justify-content:space-between;gap:12px;padding:10px 4px;border-top:1px solid #D9CFC0;text-decoration:none;color:#2B211B" style-hover="background:rgba(43,33,27,.05)"><span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:15px;font-weight:600">{{ h.title }}</span><span style="font-size:12px;color:rgba(43,33,27,.55)">{{ h.sub }}</span></span><span style="font-size:12px;color:rgba(43,33,27,.55);white-space:nowrap">{{ h.right }}</span></a>
</sc-for>
</div>
</sc-for>
<sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}"><p style="margin:0;font-size:14px;color:rgba(43,33,27,.55)">Nothing matches. Try a surname, a client, or a skill.</p></sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const INDEX = [
  {g: 'Candidates', title: 'Amara Osei', sub: 'Backend Engineer, Fenmark. Go, Kafka, payments.', right: 'Interview, Offer', href: 'Candidate Record.dc.html', k: 'amara osei fenmark go kafka payments candidate'},
  {g: 'Candidates', title: 'Lucía Ferreira', sub: 'Staff Engineer, Emberly.', right: 'Sent', href: 'Candidate Record.dc.html', k: 'lucia lucía ferreira emberly go kubernetes'},
  {g: 'Candidates', title: 'Rosa Alvarez', sub: 'Data Engineer, contractor.', right: 'Offer', href: 'Candidate Record.dc.html', k: 'rosa alvarez data spark python contractor'},
  {g: 'Candidates', title: 'Femi Adebayo', sub: 'On site, Brightwell. Right to work expires in 9 days.', right: 'Contractor', href: 'Candidate Record.dc.html', k: 'femi adebayo brightwell contractor right to work'},
  {g: 'Candidates', title: 'Priyanka Rao', sub: 'Applied yesterday, unowned.', right: 'New', href: 'Candidates.dc.html', k: 'priyanka rao applied unowned gocardless'},
  {g: 'Clients', title: 'Brightwell Payments', sub: 'Fintech, Leeds and London. 6 to fill, 9 on site.', right: '5 need you', href: 'Client Record.dc.html', k: 'brightwell payments fintech leeds london client'},
  {g: 'Clients', title: 'Ordell Software', sub: 'SaaS, Manchester. Ruth quiet 9 days.', right: 'Quiet', href: 'Client Record.dc.html', k: 'ordell software saas manchester client'},
  {g: 'Clients', title: 'Northbeam Data', sub: 'Analytics, Leeds. Invoice overdue.', right: 'Overdue', href: 'Client Record.dc.html', k: 'northbeam data analytics leeds client invoice'},
  {g: 'Contacts', title: 'Dan Okafor', sub: 'Head of Engineering, Brightwell. 4 items waiting.', right: 'Contact', href: 'Contact Record.dc.html', k: 'dan okafor brightwell head of engineering hiring manager'},
  {g: 'Contacts', title: 'Ruth Vance', sub: 'VP Engineering, Ordell.', right: 'Contact', href: 'Contact Record.dc.html', k: 'ruth vance ordell vp engineering'},
  {g: 'Contacts', title: 'Claire Dunn', sub: 'Procurement, Brightwell. Rate card review 30 Sep.', right: 'Contact', href: 'Contact Record.dc.html', k: 'claire dunn brightwell procurement rate card'},
  {g: 'Jobs', title: 'Senior Backend Engineer', sub: 'Brightwell, perm, £85,000 to £95,000. 3 sent, 2 at interview.', right: '24 days', href: 'Job Record.dc.html', k: 'senior backend engineer brightwell perm go kafka postgres payments job'},
  {g: 'Jobs', title: 'Data Engineers, payments platform', sub: 'Brightwell, T&M, £550 to £600 a day.', right: '31 days', href: 'Job Record.dc.html?type=T%26M', k: 'data engineers payments platform brightwell t&m contract spark python job'},
  {g: 'Jobs', title: 'Payments migration, phase 2', sub: 'Brightwell, SOW, milestone 3 awaiting.', right: 'Delivering', href: 'Job Record.dc.html?type=SOW', k: 'payments migration phase 2 brightwell sow statement of work milestone'},
  {g: 'Jobs', title: 'Platform Lead', sub: 'Northbeam, perm, Nadia\'s job.', right: '18 days', href: 'Job Record.dc.html', k: 'platform lead northbeam perm kubernetes leadership job'},
  {g: 'Documents', title: 'Brightwell terms of business', sub: 'Signed 3 Mar 2026, 16%, rebate to 12 weeks.', right: 'Contracts', href: 'Client Record.dc.html', k: 'brightwell terms of business msa contract rebate fee'},
  {g: 'Documents', title: 'Amara Osei CV Sep 2026', sub: 'Current version, sent to Brightwell and Ordell.', right: 'CV', href: 'Candidate Record.dc.html', k: 'amara osei cv resume'},
];
class Component extends DCLogic {
  state = (() => { const u = new URLSearchParams(window.location.search); return {q: u.get('q') || '', type: 'All', sort: 'Relevance'}; })();
  renderVals() {
    const s = this.state; const q = s.q.trim().toLowerCase();
    const words = q.split(/\s+/).filter(Boolean);
    let hits = words.length ? INDEX.filter(x => words.every(w => (x.title + ' ' + x.sub + ' ' + x.k).toLowerCase().includes(w))) : INDEX;
    const order = ['Candidates', 'Clients', 'Contacts', 'Jobs', 'Documents'];
    const INK = '#2B211B', MID = 'rgba(43,33,27,.70)', TAUPE = '#D9CFC0';
    if (s.type !== 'All') hits = hits.filter(h => h.g === s.type);
    if (s.sort === 'A to Z') hits = [...hits].sort((a, b) => a.title.localeCompare(b.title));
    const groups = order.map(g => ({label: g, hits: hits.filter(h => h.g === g)})).filter(g => g.hits.length);
    const counts = g => (words.length ? INDEX.filter(x => words.every(w => (x.title + ' ' + x.sub + ' ' + x.k).toLowerCase().includes(w))) : INDEX).filter(h => g === 'All' || h.g === g).length;
    return {q: s.q, setQ: e => this.setState({q: e.target.value}), groups, empty: hits.length === 0,
      resultLine: words.length ? hits.length + ' match' + (hits.length === 1 ? '' : 'es') + ' for "' + s.q.trim() + '".' : 'Everything. Type to narrow it down.',
      typeFilters: ['All', ...order].map(t => ({label: t + ' ' + counts(t), go: () => this.setState({type: t}), border: s.type === t ? '1px solid ' + INK : '1px solid ' + TAUPE, ink: s.type === t ? INK : MID, weight: s.type === t ? '600' : '400'})),
      sorts: ['Relevance', 'A to Z'].map(k => ({label: k, go: () => this.setState({sort: k}), ink: s.sort === k ? INK : MID, weight: s.sort === k ? '600' : '400', deco: s.sort === k ? 'underline' : 'none'})),
    };
  }
}

</script>
</body>
</html>
